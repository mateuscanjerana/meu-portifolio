<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc">
  <title id="title">EditPic — editor de imagens</title>
  <desc id="desc">Ilustração conceitual do EditPic com faixa turquesa contendo o nome do projeto, janela de aplicativo, imagem original, enquadramento horizontal, ferramentas e exportação.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10182c"/>
      <stop offset="1" stop-color="#19244a"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#171f3a"/>
      <stop offset="1" stop-color="#121c36"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#294b78"/>
      <stop offset="1" stop-color="#6fb4c0"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#345b85"/>
      <stop offset="1" stop-color="#73bdbc"/>
    </linearGradient>
    <linearGradient id="tealBanner" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42d5c4"/>
      <stop offset="1" stop-color="#1ba7a0"/>
    </linearGradient>
    <linearGradient id="action" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#50e1cd"/>
      <stop offset="1" stop-color="#269d9b"/>
    </linearGradient>
    <clipPath id="before"><rect x="272" y="134" width="120" height="151" rx="12"/></clipPath>
    <clipPath id="after"><rect x="453" y="155" width="166" height="109" rx="11"/></clipPath>
  </defs>

  <!-- Fundo e detalhe gráfico da mesma família do login-preview.svg -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="675" cy="35" r="230" fill="#37d0c0" opacity=".055"/>
  <path d="M0 385 Q170 320 320 451 H0Z" fill="#3bd5c5" opacity=".028"/>

  <!-- Janela conceitual do aplicativo -->
  <rect x="118" y="42" width="564" height="366" rx="23" fill="url(#window)" stroke="#50658e" stroke-opacity=".7" stroke-width="1.4"/>
  <path d="M141 42 H659 Q682 42 682 65 V87 H118 V65 Q118 42 141 42Z" fill="#233153"/>
  <rect x="118" y="85" width="564" height="2" fill="#34446c" opacity=".55"/>
  <circle cx="149" cy="64" r="6" fill="#e7787a"/>
  <circle cx="170" cy="64" r="6" fill="#e9c37b"/>
  <circle cx="191" cy="64" r="6" fill="#77b99f"/>
  <rect x="603" y="57" width="48" height="14" rx="7" fill="#2b4560" stroke="#4ab3a6" stroke-opacity=".4"/>
  <circle cx="618" cy="64" r="3.6" fill="#50d5c3"/>
  <path d="M625 64h16" stroke="#7c9cac" stroke-width="2" stroke-linecap="round"/>

  <!-- Barra de identidade: no mesmo padrao dos outros cards -->
  <rect x="137" y="95" width="526" height="35" rx="9" fill="url(#tealBanner)"/>
  <rect x="137.7" y="95.7" width="524.6" height="33.6" rx="8.4" fill="none" stroke="#a4fff1" stroke-opacity=".34" stroke-width="1.4"/>
  <text x="157" y="119" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" letter-spacing="-.5">EditPic</text>

  <!-- Interface original preservada, levemente compactada para acomodar a barra -->
  <g transform="matrix(1 0 0 .90 0 37)">
  <!-- Barra lateral com ferramentas, apenas símbolos vetoriais -->
  <rect x="138" y="102" width="67" height="286" rx="13" fill="#1d2949" stroke="#3b507b" stroke-opacity=".85"/>
  <rect x="151" y="116" width="41" height="42" rx="10" fill="#315b65" stroke="#55d7c6" stroke-opacity=".7"/>
  <path d="M161 145v-15a4 4 0 0 1 4-4h14a4 4 0 0 1 4 4v15" fill="none" stroke="#73e2d0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="178" cy="131" r="3" fill="#73e2d0"/>
  <path d="m161 142 7-7 6 6 4-4 5 5" fill="none" stroke="#73e2d0" stroke-width="2.5" stroke-linejoin="round"/>

  <rect x="151" y="176" width="41" height="42" rx="10" fill="#202f51"/>
  <path d="M160 192h18v17M166 183v20h20" stroke="#92b5c1" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="151" y="236" width="41" height="42" rx="10" fill="#202f51"/>
  <rect x="161" y="248" width="21" height="18" rx="2" stroke="#92b5c1" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <path d="M166 256h11m-5.5-5.5v11" stroke="#92b5c1" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="171.5" cy="356" r="4.2" fill="#6f88a6"/>
  <circle cx="171.5" cy="373" r="4.2" fill="#6f88a6" opacity=".4"/>

  <!-- Área de trabalho -->
  <rect x="222" y="102" width="440" height="286" rx="15" fill="#131d38" stroke="#34476e" stroke-opacity=".85"/>
  <rect x="238" y="116" width="408" height="188" rx="12" fill="#1b2948" stroke="#354d78"/>

  <!-- Foto original: formato vertical -->
  <g clip-path="url(#before)">
    <rect x="272" y="134" width="120" height="151" fill="url(#sky)"/>
    <circle cx="361" cy="162" r="18" fill="#e2cb98" opacity=".85"/>
    <path d="M272 250 319 184 343 216 364 194 392 232V285H272Z" fill="#1b4a60"/>
    <path d="m288 226 31-42 16 22-16-6-12 16Z" fill="#a9e0d5" opacity=".95"/>
    <path d="m334 236 30-42 28 38-23-15-10 9Z" fill="#8ccbc8"/>
    <path d="M272 259Q307 251 330 261T392 258V285H272Z" fill="#143951"/>
    <path d="M272 269Q326 260 392 272V285H272Z" fill="#1e5561"/>
  </g>
  <rect x="272" y="134" width="120" height="151" rx="12" fill="none" stroke="#587299" stroke-width="1.3"/>
  <rect x="290" y="150" width="84" height="111" rx="4" fill="none" stroke="#e3f8f0" stroke-opacity=".75" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M290 163v-13h13m58 0h13v13m-84 85v13h13m58 0h13v-13" fill="none" stroke="#69e0cf" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Transformação visual -->
  <path d="M410 213h23m-8-8 8 8-8 8" fill="none" stroke="#5bdac9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Resultado 16:9 -->
  <g clip-path="url(#after)">
    <rect x="453" y="155" width="166" height="109" fill="url(#sky2)"/>
    <circle cx="577" cy="173" r="16" fill="#e2cb98" opacity=".88"/>
    <path d="M453 239 492 192 517 215 552 177 592 231 619 209V264H453Z" fill="#1c4b61"/>
    <path d="m476 212 16-20 13 13-14-4-7 10Zm55-9 21-26 22 29-21-12-10 14Z" fill="#d1eae0" opacity=".95"/>
    <path d="M453 239Q494 224 530 240T619 238V264H453Z" fill="#1c5060"/>
    <path d="M453 248Q525 236 619 249V264H453Z" fill="#296a6b"/>
  </g>
  <rect x="453" y="155" width="166" height="109" rx="11" fill="none" stroke="#62d9c9" stroke-width="2.2"/>
  <rect x="565" y="142" width="52" height="24" rx="9" fill="#315b65" stroke="#62d9c9" stroke-opacity=".8"/>
  <text x="591" y="158" fill="#d1fff6" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">16:9</text>

  <!-- Controles esquemáticos de formato -->
  <rect x="238" y="318" width="408" height="54" rx="11" fill="#202e50" stroke="#40547a" stroke-opacity=".7"/>
  <rect x="259" y="330" width="59" height="30" rx="7" fill="#2f6569" stroke="#65dfce" stroke-width="1.3"/>
  <text x="288.5" y="349.5" fill="#dcfff8" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">16:9</text>
  <rect x="327" y="330" width="58" height="30" rx="7" fill="#263451" stroke="#4d648d"/>
  <text x="356" y="349.5" fill="#97a9c7" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">1:1</text>
  <rect x="394" y="330" width="58" height="30" rx="7" fill="#263451" stroke="#4d648d"/>
  <text x="423" y="349.5" fill="#97a9c7" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">4:3</text>
  <!-- Ícone de exportação, como o botão de ação do projeto -->
  <rect x="560" y="329" width="64" height="32" rx="8" fill="url(#action)"/>
  <path d="M592 335v13m-6-6 6 6 6-6m-16 8v4h20v-4" fill="none" stroke="#113e47" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
